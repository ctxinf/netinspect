<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>netinspect</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2128; --border:#30363d;
    --text:#e6edf3; --muted:#8b949e; --accent:#58a6ff;
    --green:#3fb950; --red:#f85149; --blue:#58a6ff; --amber:#d29922;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif}
  .mono,code,pre{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}

  /* ---- top bar ---- */
  .topbar{display:flex;align-items:center;gap:16px;padding:10px 16px;
          background:var(--panel);border-bottom:1px solid var(--border);
          position:sticky;top:0;z-index:50}
  .brand{font-weight:700;font-size:17px;letter-spacing:.3px}
  .brand::before{content:"◉";color:var(--green);margin-right:8px;font-size:13px}
  .sess{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px;min-width:0}
  .cmd{color:var(--text);background:var(--panel2);border:1px solid var(--border);
       border-radius:6px;padding:2px 8px;max-width:420px;overflow:hidden;
       text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
  .badge{font-size:12px;padding:2px 8px;border-radius:20px;border:1px solid var(--border);
         background:var(--panel2);color:var(--text)}
  .status{font-size:12.5px}
  .status.running{color:var(--green)}
  .status.ended{color:var(--red)}
  .ws-dot{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .ws-dot i{width:9px;height:9px;border-radius:50%;background:var(--red);display:inline-block}
  .ws-dot.on i{background:var(--green)}

  /* ---- stat cards ---- */
  main{padding:16px;max-width:1280px;margin:0 auto}
  .cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px 14px}
  .card .k{color:var(--muted);font-size:12px;margin-bottom:4px}
  .card .v{font-size:22px;font-weight:600}
  .card .v.fail{color:var(--red)} .card .v.ok{color:var(--green)}

  /* ---- tabs ---- */
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:0}
  .tabs button{background:none;border:none;color:var(--muted);font-size:14px;
               padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent}
  .tabs button.active{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
  .tabs button:hover{color:var(--text)}
  .toolbar{display:flex;align-items:center;gap:12px;padding:12px 0}
  .toolbar input{flex:0 1 340px;background:var(--panel);border:1px solid var(--border);
                 border-radius:6px;color:var(--text);padding:7px 10px;font-size:13px}
  .toolbar input:focus{outline:none;border-color:var(--accent)}
  .count-note{color:var(--muted);font-size:12.5px}

  /* ---- tables ---- */
  table{width:100%;border-collapse:collapse;font-size:13px;background:var(--panel);
        border:1px solid var(--border);border-radius:8px;overflow:hidden}
  thead th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;
           padding:9px 12px;border-bottom:1px solid var(--border);background:var(--panel2);
           white-space:nowrap}
  tbody td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:top}
  tbody tr:last-child td{border-bottom:none}
  tbody tr.row{cursor:pointer}
  tbody tr.row:hover{background:#1f2630}
  tbody tr.row.selected{background:#1c2b3f}
  .dim{color:var(--muted)} .small{font-size:12px}
  .sni{color:var(--muted);font-size:11.5px;margin-top:2px}
  .num{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:nowrap}
  .rbadge{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:20px;font-weight:600}
  .rbadge.ok{background:rgba(63,185,80,.15);color:var(--green);border:1px solid rgba(63,185,80,.4)}
  .rbadge.open{background:rgba(88,166,255,.15);color:var(--blue);border:1px solid rgba(88,166,255,.4);
               animation:blink 1.2s ease-in-out infinite}
  .rbadge.fail{background:rgba(248,81,73,.15);color:var(--red);border:1px solid rgba(248,81,73,.4)}
  .rbadge.pending{background:rgba(139,148,158,.12);color:var(--muted);border:1px solid var(--border)}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
  .proto{color:var(--amber)}
  .tlsms{color:var(--muted);font-size:11.5px;margin-left:6px}
  .empty{padding:28px;text-align:center;color:var(--muted)}

  /* ---- detail drawer ---- */
  .detail{position:fixed;top:0;right:0;width:400px;max-width:92vw;height:100vh;
          background:var(--panel);border-left:1px solid var(--border);z-index:100;
          transform:translateX(105%);transition:transform .22s ease;
          display:flex;flex-direction:column}
  .detail.open{transform:none}
  .detail header{display:flex;align-items:center;justify-content:space-between;
                 padding:12px 16px;border-bottom:1px solid var(--border)}
  .detail header h3{margin:0;font-size:15px}
  .detail header button{background:none;border:1px solid var(--border);color:var(--muted);
                        border-radius:6px;cursor:pointer;padding:3px 10px;font-size:14px}
  .detail header button:hover{color:var(--text);border-color:var(--muted)}
  .detail .body{padding:6px 16px 20px;overflow-y:auto}
  .drow{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
  .drow:last-child{border-bottom:none}
  .drow .dk{flex:0 0 88px;color:var(--muted)}
  .drow .dv{flex:1;min-width:0;overflow-wrap:anywhere}
  .drow pre{margin:0;white-space:pre-wrap;background:var(--bg);
             border:1px solid var(--border);border-radius:6px;padding:8px;font-size:12px}
  .foot{margin-top:14px;color:var(--muted);font-size:11.5px;text-align:center}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">netinspect</div>
  <div class="sess">
    <span class="mono" id="session-id" title="session id">—</span>
    <span class="badge" id="mode-badge">—</span>
    <code class="cmd" id="command" title="">—</code>
    <span class="status" id="status">…</span>
  </div>
  <button id="stop-server" disabled style="background:var(--panel2);color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:6px 12px;cursor:pointer" title="目标程序结束后可关闭面板">结束 Server</button>
  <div class="ws-dot" id="ws-dot"><i></i><span id="ws-text">ws 断开</span></div>
</header>

<main>
  <section class="cards">
    <div class="card"><div class="k">连接数</div><div class="v mono" id="st-conns">0</div></div>
    <div class="card"><div class="k">失败</div><div class="v mono fail" id="st-failed">0</div></div>
    <div class="card"><div class="k">上行</div><div class="v mono" id="st-up">0 B</div></div>
    <div class="card"><div class="k">下行</div><div class="v mono" id="st-down">0 B</div></div>
    <div class="card"><div class="k">DNS 查询</div><div class="v mono" id="st-dns">0</div></div>
  </section>

  <nav class="tabs">
    <button data-tab="conns" class="active">Connections</button>
    <button data-tab="dns">DNS</button>
  </nav>

  <div class="toolbar" id="toolbar-conns">
    <input id="filter" type="search" placeholder="按目标 / 进程 / SNI 过滤…" autocomplete="off">
    <span class="count-note" id="count-note"></span>
  </div>

  <table id="conns-table">
    <thead><tr>
      <th>目标</th><th>进程</th><th>模式</th><th>协议</th><th>建连耗时</th><th>流量</th><th>结果</th>
    </tr></thead>
    <tbody id="conns-body"><tr><td colspan="7" class="empty">加载中…</td></tr></tbody>
  </table>

  <table id="dns-table" hidden>
    <thead><tr>
      <th>时间</th><th>进程</th><th>查询名</th><th>类型</th><th>应答</th><th>耗时</th>
    </tr></thead>
    <tbody id="dns-body"><tr><td colspan="6" class="empty">加载中…</td></tr></tbody>
  </table>

  <p class="foot">仅展示连接级元数据，不捕获、不展示任何传输内容。</p>
</main>

<aside class="detail" id="detail" aria-hidden="true">
  <header><h3>连接详情</h3><button id="detail-close" title="关闭 (Esc)">✕</button></header>
  <div class="body" id="detail-body"></div>
</aside>

<script src="app.js"></script>
</body>
</html>

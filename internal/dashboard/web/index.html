<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>netinspect · Network inspector</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      try {
        const theme = localStorage.getItem("netinspect.theme") || "system";
        document.documentElement.dataset.theme =
          theme === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : theme;
      } catch {}
    </script>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/"
        ><img class="brand-icon" src="/favicon.png" width="28" height="28" alt="" /> <span>netinspect<span class="brand-dot">.</span></span></a
      >
      <div class="header-end">
        <select id="language" aria-label="Language" data-i18n-aria-label="Language"></select>
        <span class="live"
          ><i id="live-dot"></i><span id="live-text"><span data-i18n="Connecting">Connecting</span></span></span
        ><button
          id="theme"
          class="icon-btn"
          aria-label="Change theme" data-i18n-aria-label="Change theme"
          title="Change theme" data-i18n-title="Change theme"
        ></button
        ><a
          class="icon-btn github-link"
          href="https://github.com/ctxinf/netinspect"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="GitHub repository" data-i18n-aria-label="GitHub repository"
          title="GitHub repository" data-i18n-title="GitHub repository"
          ><svg
            viewBox="0 0 24 24"
            width="19"
            height="19"
            fill="currentColor"
            aria-hidden="true"
          >
            <path
              d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.86c-2.78.6-3.37-1.18-3.37-1.18-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.89 1.53 2.34 1.09 2.91.83.09-.65.35-1.09.64-1.34-2.22-.25-4.56-1.11-4.56-4.94 0-1.09.39-1.99 1.03-2.69-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.03A9.6 9.6 0 0 1 12 6.82c.85 0 1.71.11 2.51.34 1.91-1.3 2.75-1.03 2.75-1.03.55 1.38.2 2.4.1 2.65.64.7 1.03 1.6 1.03 2.69 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85v2.76c0 .27.18.58.69.48A10 10 0 0 0 12 2Z"
            /></svg
        ></a>
      </div>
    </header>
    <main>
      <section class="session-line" aria-label="Session information" data-i18n-aria-label="Session information">
        <strong id="status" class="session-status">—</strong>

        <span class="session-controls">
          <span class="session-item"
            ><span data-i18n="Session:">Session:</span> <strong id="session-id">—</strong></span
          >
          <button
            class="icon-btn"
            id="pause"
            title="Pause page updates; proxy and capture continue" data-i18n-title="Pause page updates; proxy and capture continue"
            aria-label="Pause updates" data-i18n-aria-label="Pause updates"
            aria-pressed="false"
          >
            Ⅱ
          </button>
          <button
            id="stop-server"
            hidden
            class="icon-btn"
            aria-label="Shut down" data-i18n-aria-label="Shut down"
            disabled
            title="Stop HTTP service and release session data" data-i18n-title="Stop HTTP service and release session data"
          >
            <svg
              aria-hidden="true"
              viewBox="0 0 24 24"
              width="17"
              height="17"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <path d="M12 2v10m-6.4-7a9 9 0 1 0 12.8 0" />
            </svg></button
        ></span>
        <span class="session-item command"
          ><span data-i18n="Command">Command</span> <strong id="command">—</strong></span
        >
        <span class="mode-tag"
          ><svg
            viewBox="0 0 24 24"
            width="17"
            height="17"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <path
              d="m12 3 10 5-10 5L2 8 12 3Zm-10 9 10 5 10-5M2 16l10 5 10-5"
            /></svg
          ><span data-i18n="Mode">Mode</span>: <strong id="mode">—</strong></span
        >

        <span id="upstream-config" class="session-item upstream-config" hidden>
          <span data-i18n="Upstream proxy">Upstream proxy</span>:
          <strong id="upstream-proxy"></strong>
        </span>
        <span class="session-item runtime"
          ><span data-i18n="Uptime">Uptime</span> <strong class="mono" id="uptime">00:00:00</strong
          ><small id="uptime-start" hidden></small
        ></span>
        <span class="session-item traffic"
          ><svg
            viewBox="0 0 24 24"
            width="17"
            height="17"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <path d="M12 3v12m-5-5 5 5 5-5M4 15v5h16v-5" /></svg
          ><strong id="st-down">0 B</strong></span
        ><span class="session-item traffic"
          ><svg
            viewBox="0 0 24 24"
            width="17"
            height="17"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <path d="M12 16V4m-5 5 5-5 5 5M4 15v5h16v-5" /></svg
          ><strong id="st-up">0 B</strong></span
        >
      </section>
      <div id="limit-notice" class="notice" hidden role="status"></div>
      <section class="list-panel" aria-label="Network records" data-i18n-aria-label="Network records">
        <div class="toolbar">
          <div class="tabs" role="group" aria-label="Record status" data-i18n-aria-label="Record status">
            <button id="tab-all" class="selected" data-status="all"><span data-i18n="All">All</span><span id="all-count">0</span>
            </button>
            <button id="tab-active" data-status="active"><span data-i18n="Active">Active</span><span id="active-count">0</span></button
            ><button id="tab-closed" data-status="closed"><span data-i18n="Closed">Closed</span><span id="closed-count">0</span>
            </button>
          </div>
          <div class="tools">
            <button
              class="icon-btn"
              id="direction"
              title="Reverse sort order" data-i18n-title="Reverse sort order"
              aria-label="Reverse sort order" data-i18n-aria-label="Reverse sort order"
            >
              ↓↑
            </button>
            <details class="sort-menu" id="sort-menu">
              <summary
                class="icon-btn"
                title="Choose sort column" data-i18n-title="Choose sort column"
                aria-label="Choose sort column" data-i18n-aria-label="Choose sort column"
              >
                <span id="sort-label" hidden></span
                ><svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M3 9l4 -4l4 4m-4 -4v14" />
                  <path d="M21 15l-4 4l-4 -4m4 4v-14" />
                </svg>
              </summary>
              <div
                class="menu"
                id="sort-options"
                role="group"
                aria-label="Sort column" data-i18n-aria-label="Sort column"
              ></div>
            </details>
          </div>
          <label class="search"
            ><span aria-hidden="true">⌕</span
            ><input
              id="filter"
              type="search"
              placeholder="Filter target, process, IP, SNI, DNS answer…" data-i18n-placeholder="Filter target, process, IP, SNI, DNS answer…"
              aria-label="Filter records" data-i18n-aria-label="Filter records"
              autocomplete="off"
            /><kbd>/</kbd></label
          >
          <button
            id="layout-toggle"
            class="icon-btn"
            aria-label="Use wide layout" data-i18n-aria-label="Use wide layout"
            title="Use wide layout" data-i18n-title="Use wide layout"
            aria-pressed="false"
          ></button>
          <button
            class="icon-btn"
            id="settings"
            title="Column settings" data-i18n-title="Column settings"
            aria-label="Column settings" data-i18n-aria-label="Column settings"
          >
            <svg
              aria-hidden="true"
              viewBox="0 0 24 24"
              width="25"
              height="25"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linejoin="round"
            >
              <polygon
                points="21.95,11.02 21.95,12.98 19.66,14.32 19.06,15.77 19.73,18.34 18.34,19.73 15.77,19.06 14.32,19.66 12.98,21.95 11.02,21.95 9.68,19.66 8.23,19.06 5.66,19.73 4.27,18.34 4.94,15.77 4.34,14.32 2.05,12.98 2.05,11.02 4.34,9.68 4.94,8.23 4.27,5.66 5.66,4.27 8.23,4.94 9.68,4.34 11.02,2.05 12.98,2.05 14.32,4.34 15.77,4.94 18.34,4.27 19.73,5.66 19.06,8.23 19.66,9.68"
              />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>
        <div class="list-info">
          <span
            ><i class="small-dot"></i> <span id="view-status"><span data-i18n="Live updates">Live updates</span></span
            ><span class="separator">/</span
            ><span id="count-note"><span data-i18n="Loading…">Loading…</span></span></span
          ><span id="refresh-error" role="status"></span>
        </div>
        <div class="table-scroll">
          <table>
            <thead>
              <tr id="table-head"></tr>
            </thead>
            <tbody id="table-body"></tbody>
          </table>
          <div class="empty" id="empty" hidden>
            <span>⌕</span><strong><span data-i18n="No records yet">No records yet</span></strong>
            <p><span data-i18n="New network activity appears here">New network activity appears here</span></p>
          </div>
        </div>
        <footer class="pagination">
          <div>
            <select id="page-size" aria-label="Records per page" data-i18n-aria-label="Records per page">
              <option value="25" data-i18n="25 / page">25 / page</option>
              <option value="50" selected data-i18n="50 / page">50 / page</option>
              <option value="100" data-i18n="100 / page">100 / page</option>
              <option value="200" data-i18n="200 / page">200 / page</option></select
            ><span id="page-range">0–0 / 0</span>
          </div>
          <nav aria-label="Pagination" data-i18n-aria-label="Pagination">
            <button id="first-page" aria-label="First page" data-i18n-aria-label="First page">«</button
            ><button id="prev-page" aria-label="Previous page" data-i18n-aria-label="Previous page">‹</button
            ><span id="page-label">1 / 1</span
            ><button id="next-page" aria-label="Next page" data-i18n-aria-label="Next page">›</button
            ><button id="last-page" aria-label="Last page" data-i18n-aria-label="Last page">»</button>
          </nav>
        </footer>
      </section>
      <footer class="foot">
        <div class="memory">
          <span><span data-i18n="Record storage">Record storage</span> <b id="memory-label">—</b></span>
          <div class="meter"><i id="memory-bar"></i></div>
        </div>
        <span
          >netinspect <span id="cli-version">—</span
          ><span id="build-info">—</span></span
        >
      </footer>
    </main>
    <dialog id="column-dialog">
      <header>
        <div><span class="brand-dot">⚙</span><span data-i18n="Column settings">Column settings</span></div>
        <button id="columns-close" class="icon-btn" aria-label="Close column settings" data-i18n-aria-label="Close column settings">
          ×
        </button>
      </header>
      <p><span data-i18n="Choose visible columns; use arrows to reorder.">Choose visible columns; use arrows to reorder.</span></p>
      <div id="column-options"></div>
      <footer>
        <button id="reset-columns"><span data-i18n="Reset defaults">Reset defaults</span></button
        ><button id="columns-done" class="primary"><span data-i18n="Done">Done</span></button>
      </footer>
    </dialog>
    <dialog id="detail-dialog">
      <header>
        <div id="detail-title"><span data-i18n="Record details">Record details</span></div>
        <button id="detail-close" class="icon-btn" aria-label="Close details" data-i18n-aria-label="Close details">
          ×
        </button>
      </header>
      <dl id="detail-body"></dl>
    </dialog>
    <script src="/translations.js"></script>
    <script src="/i18n.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
